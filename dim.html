<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Графік відключень</title>
</head>
<body>
<p style="font: 14px Arial, sans-serif; color: #5a636b; padding: 24px 16px">Завантаження…</p>
<template id="addon">
<style>
  #now:not([hidden]):has(> .pdev) { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
  #now > :not(.pdev) { grid-column: 1; }
  #now > .pdev { grid-column: 2; grid-row: 1 / span 2; }
  .pdev {
    position: relative; overflow: hidden; width: 36px; height: 30px;
    border-radius: 6px; border: 1px solid rgba(17, 32, 62, .4);
    background: var(--soft) var(--icon-maybe) no-repeat center / 16px 16px;
  }
  .pdev.split::before {
    content: ""; position: absolute; inset: 0; clip-path: inset(0 50% 0 0);
    background: var(--soft) var(--icon-maybe) no-repeat center; background-size: inherit;
  }
  .pdev.split::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(17, 32, 62, .4); }
  .pdev.on, .pdev.a-on::before { background-color: var(--yellow); background-image: var(--icon-on-dark); }
  .pdev.off, .pdev.a-off::before { background-color: var(--off); background-image: var(--icon-off); }
  @media (max-width: 480px) {
    #now:not([hidden]):has(> .pdev) { column-gap: 8px; }
    .pdev { width: 28px; height: 32px; background-size: 14px 14px; }
    .pdev.split::before { clip-path: inset(0 0 50% 0); }
    .pdev.split::after { top: 50%; bottom: auto; left: 0; right: 0; width: auto; height: 1px; }
  }
</style>
<script>
(() => {
  'use strict';
  const DEVICES = [
    { key: 'flat', label: 'Метеостанція', staleMin: 130 },
    { key: 'home', label: 'Розетка' },
  ];
  const HOME_GROUP = '3.2';
  const DEVICES_URL = 'https://svitlo.akluchnik-dp.workers.dev/devices';
  const POLL_MS = 2 * 60 * 1000;
  const timeFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit' });
  const box = document.getElementById('now');

  let dev = null;
  let devErr = null;
  let devAt = 0;
  let devOff = false;
  let loading = false;

  const group = () => {
    const chip = document.querySelector('.sgroup[aria-checked="true"]');
    return chip ? chip.textContent.trim() : null;
  };

  async function loadDevices() {
    if (group() !== HOME_GROUP || devOff || loading) return;
    loading = true;
    try {
      const r = await fetch(DEVICES_URL, { cache: 'no-store' });
      const j = await r.json().catch(() => null);
      if (r.status === 501 || (r.ok && !(j && j.devices))) {
        devOff = true;
        throw new Error(r.status === 501 ? 'Tuya не налаштовано у Worker' : 'Worker ще без /devices — задеплойте новий worker.js');
      }
      if (!r.ok || !j) throw new Error((j && j.error) || `HTTP ${r.status}`);
      dev = j;
      devErr = null;
    } catch (e) {
      devErr = (e && e.message) || String(e);
    } finally {
      devAt = Date.now();
      loading = false;
      paint();
    }
  }
  const loadIfStale = () => { if (Date.now() - devAt > 60 * 1000) loadDevices(); };

  function makeIcon() {
    const lines = [];
    const [a, b] = DEVICES.map(({ key, label, staleMin }) => {
      const d = !devErr && dev && dev.devices ? dev.devices[key] : null;
      const seenAt = d && d.lastSeen ? Date.parse(d.lastSeen) : NaN;
      const stale = staleMin && Date.now() - seenAt > staleMin * 60000;
      const st = !d || d.error ? 'unknown' : d.online && !stale ? 'on' : 'off';
      const seen = Number.isFinite(seenAt) ? `, останні дані о ${timeFmt.format(new Date(seenAt))}` : '';
      lines.push(`${label}: ${st === 'on' ? `світло є (на зв'язку${seen})`
        : st === 'off' ? `світла немає (${stale ? `немає зв'язку${seen}` : 'офлайн'})`
          : `немає даних (${devErr || (d && d.error) || 'пристрою немає в TUYA_DEVICES'})`}`);
      return st;
    });
    if (dev && !devErr && dev.checkedAt) lines.push(`Перевірено о ${timeFmt.format(new Date(dev.checkedAt))}`);
    const icon = document.createElement('span');
    icon.className = a === b ? `pdev ${a}` : `pdev ${b} split a-${a}`;
    icon.title = lines.join('\n');
    icon.setAttribute('role', 'img');
    icon.setAttribute('aria-label', lines.join('; '));
    return icon;
  }

  function paint() {
    const old = box.querySelector(':scope > .pdev');
    if (box.hidden || group() !== HOME_GROUP || (!dev && !devErr)) { if (old) old.remove(); return; }
    const icon = makeIcon();
    if (old && old.className === icon.className && old.title === icon.title) return;
    if (old) old.replaceWith(icon); else box.append(icon);
  }
  new MutationObserver(paint).observe(box, { childList: true });

  document.getElementById('refresh').addEventListener('click', loadDevices);
  document.getElementById('groups').addEventListener('click', () => setTimeout(loadIfStale));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadIfStale(); });
  setInterval(() => { if (!document.hidden) loadDevices(); }, POLL_MS);
  loadDevices();
})();
</script>
</template>
<script>
(async () => {
  const url = new URL(location.href);
  if (!url.searchParams.get('group') && !new URLSearchParams(url.hash.slice(1)).get('group')) {
    url.searchParams.set('group', '3.2');
    history.replaceState(null, '', url);
  }
  try {
    const r = await fetch('grafik.html', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const html = await r.text();
    const at = html.lastIndexOf('</body>');
    if (at < 0) throw new Error('неочікуваний вміст grafik.html');
    const addon = document.getElementById('addon').innerHTML;
    document.open();
    document.write(html.slice(0, at) + addon + html.slice(at));
    document.close();
  } catch (e) {
    document.body.textContent = `Не вдалося завантажити grafik.html (${(e && e.message) || e}). Перевірте інтернет і оновіть сторінку.`;
  }
})();
</script>
</body>
</html>
