<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Графік відключень</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {

    --muted: #5a636b;
    --line: #bebebe;
    --off: #d3d4d5;
    --maybe: rgba(204, 206, 207, .33);
    --yellow: #ffe500;

    --icon-on: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11.9 8.5L4.43 1.18L3.75 4.47L3.02 7.87C3 7.95 3 8.04 3.02 8.13C3.04 8.21 3.08 8.29 3.14 8.36C3.2 8.43 3.27 8.48 3.35 8.52C3.43 8.55 3.52 8.57 3.6 8.57H6.36L5.45 15.34C5.44 15.47 5.46 15.59 5.53 15.7C5.59 15.81 5.69 15.9 5.81 15.95C5.88 15.98 5.96 16 6.04 16C6.12 16 6.21 15.98 6.29 15.94C6.37 15.9 6.43 15.84 6.48 15.77L10.2 10.79L11.9 8.5ZM11.9 8.5L13.72 6.06C13.78 5.98 13.81 5.88 13.82 5.78C13.83 5.68 13.81 5.58 13.77 5.49C13.72 5.39 13.65 5.3 13.56 5.24C13.47 5.18 13.36 5.14 13.25 5.14L10.53 5.14L11.44.7C11.46.61 11.46.53 11.44.44C11.42.36 11.38.28 11.32.21C11.26.14 11.19.09 11.11.05C11.03.02 10.95 0 10.86 0L5.14 0C5.01 0 4.89.04 4.78.12C4.68.2 4.61.31 4.58.44L4.43 1.18L11.9 8.5Z' fill='%23FFE500'/%3E%3C/svg%3E");
    --icon-maybe: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15.88 15.08L.92.12L.12.92L3.73 4.52L2.94 7.87C2.92 7.95 2.92 8.04 2.94 8.13C2.96 8.21 2.99 8.29 3.05 8.36C3.1 8.42 3.17 8.48 3.25 8.51C3.33 8.55 3.41 8.56 3.5 8.56H6.22L5.19 15.23C5.17 15.35 5.19 15.48 5.25 15.59C5.31 15.7 5.41 15.78 5.53 15.83C5.6 15.86 5.67 15.87 5.75 15.88C5.84 15.87 5.92 15.85 6 15.82C6.07 15.78 6.14 15.72 6.19 15.66L9.95 10.74L15.08 15.88L15.88 15.08ZM11.67 8.49L13.51 6.09C13.57 6.01 13.6 5.92 13.61 5.82C13.62 5.72 13.61 5.62 13.57 5.53C13.53 5.43 13.46 5.35 13.37 5.28C13.28 5.22 13.17 5.19 13.06 5.19H10.39L11.38.81C11.39.73 11.39.64 11.37.56C11.35.48 11.32.4 11.26.33C11.21.27 11.14.21 11.06.18C10.98.14 10.9.12 10.81.12H5.19C5.06.12 4.93.16 4.83.24C4.73.32 4.65.43 4.62.56L4.46 1.29L11.67 8.49Z' fill='%23898E96'/%3E%3C/svg%3E");
    --icon-on-dark: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11.9 8.5L4.43 1.18L3.75 4.47L3.02 7.87C3 7.95 3 8.04 3.02 8.13C3.04 8.21 3.08 8.29 3.14 8.36C3.2 8.43 3.27 8.48 3.35 8.52C3.43 8.55 3.52 8.57 3.6 8.57H6.36L5.45 15.34C5.44 15.47 5.46 15.59 5.53 15.7C5.59 15.81 5.69 15.9 5.81 15.95C5.88 15.98 5.96 16 6.04 16C6.12 16 6.21 15.98 6.29 15.94C6.37 15.9 6.43 15.84 6.48 15.77L10.2 10.79L11.9 8.5ZM11.9 8.5L13.72 6.06C13.78 5.98 13.81 5.88 13.82 5.78C13.83 5.68 13.81 5.58 13.77 5.49C13.72 5.39 13.65 5.3 13.56 5.24C13.47 5.18 13.36 5.14 13.25 5.14L10.53 5.14L11.44.7C11.46.61 11.46.53 11.44.44C11.42.36 11.38.28 11.32.21C11.26.14 11.19.09 11.11.05C11.03.02 10.95 0 10.86 0L5.14 0C5.01 0 4.89.04 4.78.12C4.68.2 4.61.31 4.58.44L4.43 1.18L11.9 8.5Z' fill='%2311203E'/%3E%3C/svg%3E");
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text); font: 14px/1.4 Roboto, "Segoe UI", Arial, sans-serif; }
  main { max-width: 847px; margin: 0 auto; padding: 24px 16px 40px; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; line-height: 26px; font-weight: 700; color: var(--muted); margin: 0; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .btn, .sgroup {
    appearance: none; height: 35px; border-radius: 10px; background: var(--soft); border: 1px solid var(--soft);
    font: inherit; font-weight: 500; cursor: pointer;
  }
  .btn { padding: 0 16px; color: var(--text); flex: none; }
  .btn:disabled { opacity: .6; cursor: default; }

  .groups { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
  .sgroup { padding: 0; color: rgba(17, 32, 62, .6); font-variant-numeric: tabular-nums; }
  .sgroup.st-on { background: var(--yellow); border-color: var(--yellow); color: var(--text); }
  .sgroup.st-off { background: var(--off); border-color: var(--off); color: var(--text); }
  .sgroup.st-maybe { background: #e6e7e8; border-color: #e6e7e8; color: var(--text); }
  .sgroup[aria-checked="true"] { color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 2px var(--text); }
  .sgroup:focus-visible, .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .notice { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .notice.warn { background: #fff8cc; }
  .notice.err { background: #fde4e1; color: #8a1f14; }

  .outage { border: 1px solid #cfcfcf; border-radius: 10px; padding: 15px; margin-bottom: 30px; font-size: 16px; }
  .outage .sub2 { font-size: 14px; color: var(--muted); }
  .outage .v-short { display: none; }
  .outage.st-on { background: var(--yellow); border-color: var(--yellow); }
  .outage.st-off { background: var(--off); border-color: var(--off); }
  .outage.st-on .sub2, .outage.st-off .sub2 { color: var(--text); }

  .prev-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(17, 32, 62, .18);
    background: rgba(255, 255, 255, .75); color: var(--text); font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .prev-btn:hover { background: #fff; }
  .prev-btn:disabled { opacity: .6; cursor: default; }
  .prev-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .prev-btn .short { display: none; }
  .past-error { margin: -10px 0 14px; font-size: 13px; color: #8a1f14; }

  .discon-title { font-size: 22px; line-height: 26px; font-weight: 500; margin: 0 0 20px; }
  .day { margin-bottom: 40px; }
  .date-pill {
    display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 10px;
    background: var(--yellow); border: 1px solid var(--yellow); border-radius: 8.79px;
    font-size: 18px; font-weight: 500; line-height: 23px; margin-bottom: 12px; position: relative;
  }
  .date-pill .ic { width: 20px; height: 20px; background: var(--icon-off) no-repeat center / 16.33px 16.64px; }
  .date-pill .p-short { display: none; }
  .date-pill.past { background: var(--soft); border-color: var(--soft); }
  .summary { margin: 0 0 12px; }
  .summary-none { font-size: 16px; font-weight: 500; }
  .ranges { display: flex; flex-wrap: wrap; gap: 6px; }
  .range-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 8px;
    background: var(--off); font-size: 16px; font-weight: 500; line-height: 20px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .range-pill .ic { width: 16px; height: 16px; flex: none; background: var(--icon-off) no-repeat center / 14px 14px; }
  .range-pill.maybe { background: repeating-linear-gradient(135deg, #e3e4e5 0 4px, #f3f3f4 4px 8px); }
  .range-pill.maybe .ic { background-image: var(--icon-maybe); }
  .range-pill small { font-size: 13px; font-weight: 400; color: rgba(17, 32, 62, .78); }
  .daybar { position: relative; display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin: 0 0 8px; }
  @media (min-width: 846px) {
    .daybar { margin-left: 93px; margin-right: 1px; }
  }
  .daybar .seg {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 3px;
    container-type: inline-size; background: var(--off);
  }
  .daybar .seg .ic { width: 12px; height: 12px; flex: none; background: var(--icon-off) no-repeat center / 12px 12px; }
  .daybar .seg.on .ic { background-image: var(--icon-on-dark); }
  .daybar .seg.maybe .ic { background-image: var(--icon-maybe); }
  .daybar .seg.on { background: var(--yellow); }
  .daybar .seg.maybe { background: repeating-linear-gradient(135deg, #c9cacc 0 3px, #f3f3f4 3px 6px); }
  .daybar .seg.na { background: #eeeeef; }
  .daybar .seg .num { font-size: 13px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .daybar .seg .unit { font-size: 13px; font-weight: 700; line-height: 1; margin-left: -2px; }
  @container (max-width: 44px) { .daybar .seg:not(.int) .unit { display: none; } }
  @container (max-width: 36px) { .daybar .seg:not(.int) .ic { display: none; } }
  @container (max-width: 21px) { .daybar .seg:not(.int) .num { display: none; } }
  @container (max-width: 33px) { .daybar .seg.int .unit { display: none; } }
  @container (max-width: 26px) { .daybar .seg.int .ic { display: none; } }
  @container (max-width: 12px) { .daybar .seg.int .num { display: none; } }
  .daybar .now-mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #d93a2b; box-shadow: 0 0 0 1px #fff; }
  .totals { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
  .totals .total { display: inline-flex; align-items: center; gap: 6px; }
  .totals b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .totals .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .totals .dot.off { background: var(--off); }
  .totals .dot.on { background: var(--yellow); }
  .totals .dot.maybe { background: repeating-linear-gradient(135deg, #c9cacc 0 2px, #f3f3f4 2px 4px); }

  .c-on { background: #fff; }
  .c-na { background: repeating-linear-gradient(135deg, #ececec 0 4px, #fff 4px 8px); }
  .c-off { background: var(--off) var(--icon-off) no-repeat center / 16px 16px; }
  .c-maybe { background: var(--maybe) var(--icon-maybe) no-repeat center / 16px 16px; }
  .c-first, .c-second, .c-mfirst, .c-msecond { position: relative; background: #fff var(--icon-on) no-repeat center / 16px 16px; }
  .c-first::before, .c-second::before, .c-mfirst::before, .c-msecond::before {
    content: ""; position: absolute; top: 0; width: 50%; height: 100%;
    background: var(--off) var(--icon-off) no-repeat; background-size: 16px 16px;
  }
  .c-mfirst::before, .c-msecond::before { background-color: var(--maybe); background-image: var(--icon-maybe); }
  .c-first::before, .c-mfirst::before { left: 0; border-right: 1px solid var(--line); background-position: 7px center; }
  .c-second::before, .c-msecond::before { right: 0; border-left: 1px solid var(--line); background-position: -7px center; }

  .fact-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  table.fact { width: 100%; table-layout: fixed; border: 0; border-collapse: separate; border-spacing: 0; margin: 0; }
  .fact th, .fact td { padding: 0; border-right: 1px solid var(--line); }
  .fact th:last-child, .fact td:last-child { border-right: 0; }
  .fact thead th { height: 55px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 500; vertical-align: middle; }
  .fact thead th div { display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; }
  .fact .head { width: 92px; padding: 9px 11px; text-align: left; }
  .fact thead th.head div { writing-mode: horizontal-tb; display: inline-block; }
  .fact tbody td { height: 38px; }

  .table2col { display: none; flex-wrap: wrap; justify-content: center; gap: 12px 20px; margin-bottom: 12px; }
  .table2col .t-wrap { flex: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .table2col table { width: min-content; min-width: 106px; border: 0; border-collapse: separate; border-spacing: 0; }
  .table2col th, .table2col td { padding: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .table2col th:last-child, .table2col td:last-child { border-right: 0; }
  .table2col tbody tr:last-child td { border-bottom: 0; }
  .table2col th { height: 40px; font-size: 12px; font-weight: 500; }
  .table2col th.head { min-width: 70px; padding: 12px 22px; text-align: center; }
  .table2col td.time { min-width: 70px; padding: 7px 10px; text-align: center; white-space: nowrap; font-size: 12px; font-weight: 500; }
  .table2col td.cell { min-width: 35px; height: 30px; }

  .info-message {
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center;
    min-height: 95px; padding: 10px 20px; margin-bottom: 15px; background: var(--soft); border-radius: 10px; font-size: 16px;
  }
  .info-message span { font-size: 14px; color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .page-legend { margin: 0 0 20px; }
  .legend .li { display: flex; align-items: center; gap: 10px; height: 26px; }
  .legend .box { display: block; width: 21px; height: 26px; border: 1px solid var(--line); background-size: 15.75px 15.75px; }
  .legend .c-first, .legend .c-second, .legend .c-mfirst, .legend .c-msecond { background-size: 10px 10px; }
  .legend .box::before { background-size: 10px 10px; }
  .legend .c-first::before, .legend .c-mfirst::before { background-position: 5px center; }
  .legend .c-second::before, .legend .c-msecond::before { background-position: -5px center; }

  .meta { font-size: 12px; color: var(--muted); }
  .meta p { margin: 0 0 4px; }
  .meta a { color: inherit; }

  .tip {
    position: fixed; z-index: 10; max-width: min(320px, calc(100vw - 16px)); padding: 7px 10px; border-radius: 8px;
    background: var(--text); color: #fff; font-size: 13px; line-height: 1.35; white-space: pre-line;
    box-shadow: 0 4px 14px rgba(17, 32, 62, .25); pointer-events: none;
  }

  @media (max-width: 845px) {
    .groups { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .discon-title { margin-top: 10px; }
    .date-pill { height: auto; padding: 7px 27px; justify-content: flex-start; font-size: 14px; line-height: 18.2px; }
    .prev-btn { height: 26px; padding: 0 10px; right: 6px; }
    .prev-btn .full { display: none; }
    .prev-btn .short { display: inline; }
    .fact-wrap { display: none; }
    .table2col { display: flex; }
    .table2col .cell::before, .legend .box::before { width: 100%; height: 50%; left: 0; right: auto; border-left: 0; border-right: 0; }
    .table2col .c-first::before, .table2col .c-mfirst::before { top: 0; border-bottom: 1px solid var(--line); background-position: center 7px; }
    .table2col .c-second::before, .table2col .c-msecond::before { top: auto; bottom: 0; border-top: 1px solid var(--line); background-position: center -7px; }
    .legend .li { width: 100%; }
    .legend .box::before { background-size: 12px 12px; }
    .legend .c-first::before, .legend .c-mfirst::before { top: 0; border-bottom: 1px solid var(--line); background-position: center 6px; }
    .legend .c-second::before, .legend .c-msecond::before { top: auto; bottom: 0; border-top: 1px solid var(--line); background-position: center -6px; }
  }

  @media (max-width: 480px) {
    .outage .v-full { display: none; }
    .outage .v-short { display: inline; }
    .outage .now-title { font-size: 24px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .outage .sub2 { font-size: 13px; margin-top: 2px; }
    .day .date-pill { padding: 6px 6px 6px 12px; gap: 8px; }
    .date-pill .pill-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day .date-pill .p-full { display: none; }
    .day .date-pill .p-short { display: inline; }
    .date-pill .prev-btn { position: static; transform: none; margin-left: auto; flex: none; }
    .ranges { gap: 4px; }
    .range-pill { font-size: 13px; padding: 4px 6px 4px 4px; gap: 3px; }
    .range-pill .ic { width: 12px; height: 12px; background-size: 12px 12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Графік відключень</h1>
      <p class="sub">ДТЕК Дніпровські електромережі · <span id="group-title">Черга</span></p>
    </div>
    <button class="btn" id="refresh" type="button">Оновити</button>
  </header>

  <div class="groups" id="groups" role="radiogroup" aria-label="Черга"></div>
  <div id="notices"></div>
  <div class="outage" id="now" hidden></div>

  <h2 class="discon-title">Графік відключень:</h2>
  <div id="past"></div>
  <section class="day" id="today"></section>
  <section class="day" id="tomorrow"></section>

  <div class="legend page-legend" id="legend" aria-label="Легенда"></div>
  <div class="meta" id="meta"></div>
  <noscript><p>Для роботи сторінки потрібен JavaScript.</p></noscript>
</main>

<script>
(() => {
  'use strict';

  const LIVE_URL = 'https://svitlo.akluchnik-dp.workers.dev';
  const SRC = 'https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/dnipro.json';
  const SITE = 'https://www.dtek-dnem.com.ua/ua/shutdowns';
  const REPO = 'https://github.com/Baskerville42/outage-data-ua';
  const DEFAULT_GROUP = '3.2';
  const RELOAD_MS = 5 * 60 * 1000;
  const REFRESH_COOLDOWN_MS = 1000;
  const HISTORY_API = 'https://api.github.com/repos/Baskerville42/outage-data-ua/commits?path=data/dnipro.json&per_page=1&until=';
  const RAW_AT = (sha) => `https://raw.githubusercontent.com/Baskerville42/outage-data-ua/${sha}/data/dnipro.json`;
  const FALLBACK_GROUPS = ['1.1', '1.2', '2.1', '2.2', '3.1', '3.2', '4.1', '4.2', '5.1', '5.2', '6.1', '6.2'];

  const HALVES = {
    yes: ['on', 'on'], no: ['off', 'off'], maybe: ['maybe', 'maybe'],
    first: ['off', 'on'], second: ['on', 'off'],
    mfirst: ['maybe', 'on'], msecond: ['on', 'maybe'],
  };
  const CELL = { yes: 'c-on', no: 'c-off', maybe: 'c-maybe', first: 'c-first', second: 'c-second', mfirst: 'c-mfirst', msecond: 'c-msecond' };
  const TYPES = {
    yes: 'Світло є', no: 'Світла немає', maybe: 'Можливо відключення',
    first: 'Світла не буде перші 30 хв.', second: 'Світла не буде другі 30 хв',
    mfirst: 'Світла можливо не буде перші 30 хв.', msecond: 'Світла можливо не буде другі 30 хв',
  };

  const TZ = (() => {
    try { new Intl.DateTimeFormat('en', { timeZone: 'Europe/Kyiv' }); return 'Europe/Kyiv'; }
    catch (e) { return 'Europe/Kiev'; }
  })();
  const partsFmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  const pillFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, day: '2-digit', month: '2-digit', year: '2-digit' });
  const pillShortFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, day: '2-digit', month: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  const timeSecFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const YTYPE = { Definite: 'off', NotPlanned: 'on' };
  function yasnoHours(slots) {
    const stateAt = (min) => {
      const s = slots.find((x) => min >= x.start && min < x.end);
      return s ? (YTYPE[s.type] || 'maybe') : 'on';
    };
    const hours = {};
    for (let h = 0; h < 24; h++) {
      const a = stateAt(h * 60 + 15);
      const b = stateAt(h * 60 + 45);
      hours[h + 1] = Object.keys(HALVES).find((k) => HALVES[k][0] === a && HALVES[k][1] === b) || 'no';
    }
    return hours;
  }
  function kyivStamp(ms) {
    if (!Number.isFinite(ms)) return '';
    const p = {};
    for (const x of partsFmt.formatToParts(new Date(ms))) p[x.type] = x.value;
    return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
  }
  function dtekStamp(s) {
    const m = /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/.exec(String(s || ''));
    return m ? `${m[3]}-${m[2]}-${m[1]} ${m[4]}:${m[5]}` : '';
  }

  function parseYasno(json) {
    const days = {};
    for (const [g, gd] of Object.entries(json || {})) {
      if (!/^\d+\.\d+$/.test(g) || !gd || typeof gd !== 'object') continue;
      const stamp = kyivStamp(Date.parse(gd.updatedOn));
      for (const part of ['today', 'tomorrow']) {
        const d = gd[part];
        const ms = d && Date.parse(d.date);
        if (!Number.isFinite(ms)) continue;
        const key = String(Math.round(ms / 1000));
        const day = days[key] || (days[key] = { groups: {}, notes: {}, stamp: '' });
        if (stamp > day.stamp) day.stamp = stamp;
        const k = 'GPV' + g;
        if (d.status === 'ScheduleApplies') day.groups[k] = yasnoHours(Array.isArray(d.slots) ? d.slots : []);
        else if (d.status === 'NoOutages') day.groups[k] = yasnoHours([]);
        else if (d.status === 'EmergencyShutdowns') day.notes[k] = 'EmergencyShutdowns';
      }
    }
    for (const k of Object.keys(days)) {
      if (!Object.keys(days[k].groups).length && !Object.keys(days[k].notes).length) delete days[k];
    }
    return days;
  }

  function mergeSources(mirrorJson, yasnoDays) {
    if (!mirrorJson && !yasnoDays) return null;
    const mirrorDays = (mirrorJson && mirrorJson.fact && mirrorJson.fact.data) || {};
    const days = {};
    const info = {};
    const put = (key, groups, notes, stamp, winsTie) => {
      const cur = info[key];
      if (cur && (stamp < cur.stamp || (stamp === cur.stamp && !winsTie))) return;
      days[key] = groups;
      info[key] = { stamp, notes: notes || {} };
    };
    const mirrorStamp = mirrorJson ? dtekStamp(mirrorJson.fact.update) : '';
    for (const [k, g] of Object.entries(mirrorDays)) put(k, g, null, mirrorStamp, false);
    for (const [k, d] of Object.entries(yasnoDays || {})) put(k, d.groups, d.notes, d.stamp, true);
    for (const [k, inf] of Object.entries(info)) {
      for (const [g, note] of Object.entries(inf.notes || {})) {
        if (note !== 'EmergencyShutdowns' || !mirrorDays[k] || !mirrorDays[k][g]) continue;
        days[k] = { ...days[k], [g]: mirrorDays[k][g] };
        inf.notes = { ...inf.notes };
        delete inf.notes[g];
        inf.fallback = { ...(inf.fallback || {}), [g]: true };
      }
    }
    return { fact: { data: days }, preset: (mirrorJson && mirrorJson.preset) || null, info };
  }

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  let data = null;
  let loadedAt = 0;
  let loading = false;
  let loadError = null;
  let mirror = null;
  let yasno = null;
  let mirrorErr = null;
  let yasnoErr = null;
  let yasnoAt = 0;
  let lastManualAt = 0;
  let group = readGroup() || storedGroup() || DEFAULT_GROUP;
  let groupsSig = '';

  function normalizeGroup(g) {
    const m = g ? /^(?:GPV)?(\d+\.\d+)$/i.exec(g.trim()) : null;
    return m ? m[1] : null;
  }
  function readGroup() {
    return normalizeGroup(new URLSearchParams(location.search).get('group'))
      || normalizeGroup(new URLSearchParams(location.hash.slice(1)).get('group'));
  }
  function storedGroup() {
    try { return localStorage.getItem('dtek-group'); } catch (e) { return null; }
  }
  function setGroup(g) {
    group = g;
    try { localStorage.setItem('dtek-group', g); } catch (e) {}
    try {
      const url = new URL(location.href);
      url.searchParams.set('group', g);
      url.hash = '';
      history.replaceState(null, '', url);
    } catch (e) {}
    render();
  }

  function kyiv(date) {
    const p = {};
    for (const x of partsFmt.formatToParts(date)) p[x.type] = x.value;
    return { ymd: `${p.year}-${p.month}-${p.day}`, h: Number(p.hour) % 24, m: Number(p.minute), s: Number(p.second) };
  }
  function snapMidnight(sec) {
    const h = kyiv(new Date(sec * 1000)).h;
    if (h === 23) return sec + 3600;
    if (h === 1) return sec - 3600;
    return sec;
  }
  function kyivMidnight(ms) {
    const p = kyiv(new Date(ms));
    return snapMidnight(Math.floor(ms / 1000) - (p.h * 3600 + p.m * 60 + p.s));
  }
  const prevMidnight = (sec) => snapMidnight(sec - 86400);
  const nextMidnight = (sec) => snapMidnight(sec + 86400);
  const hhmm = (i) => `${String(Math.floor(i / 2)).padStart(2, '0')}:${i % 2 ? '30' : '00'}`;
  const at = (i) => (i <= 48 ? hhmm(i) : `${hhmm(i - 48)} завтра`);

  const halvesOf = (v) => HALVES[v] || ['na', 'na'];
  function slotsOf(hours) {
    const s = [];
    for (let h = 1; h <= 24; h++) s.push(...halvesOf(hours[h]));
    return s;
  }
  function segmentsOf(slots) {
    const segs = [];
    for (let i = 0; i < slots.length;) {
      let j = i;
      while (j < slots.length && slots[j] === slots[i]) j++;
      segs.push({ kind: slots[i], a: i, b: j });
      i = j;
    }
    return segs;
  }
  const stateAt = (hours, n) => (hours ? halvesOf(hours[n.h + 1])[n.m >= 30 ? 1 : 0] : null);
  function placeNowMark(mark, n) {
    mark.style.left = `${((n.h * 60 + n.m) / 1440) * 100}%`;
    mark.title = `Зараз ${String(n.h).padStart(2, '0')}:${String(n.m).padStart(2, '0')}`;
  }

  function groupList() {
    const set = new Set(FALLBACK_GROUPS);
    const days = (data && data.fact && data.fact.data) || {};
    const notes = Object.values((data && data.info) || {}).map((i) => i.notes || {});
    for (const day of [...Object.values(days), ...notes]) {
      for (const k of Object.keys(day || {})) {
        const m = /^GPV(\d+)\.(\d+)$/.exec(k);
        if (m && Number(m[1]) < 100) set.add(`${m[1]}.${m[2]}`);
      }
    }
    const list = [...set];
    return list.sort((x, y) => {
      const [a1, a2] = x.split('.').map(Number);
      const [b1, b2] = y.split('.').map(Number);
      return a1 - b1 || a2 - b2;
    });
  }

  function dayKeys() {
    const out = { today: null, tomorrow: null };
    const days = data && data.fact && data.fact.data;
    if (!days) return out;
    const now = Date.now();
    const t = kyiv(new Date(now)).ymd;
    const n = kyiv(new Date(now + 864e5)).ymd;
    for (const k of Object.keys(days)) {
      const d = kyiv(new Date(Number(k) * 1000)).ymd;
      if (d === t) out.today = k;
      else if (d === n) out.tomorrow = k;
    }
    return out;
  }
  function isEmergency(key, g) {
    const inf = key && data && data.info && data.info[key];
    return !!inf && ((inf.notes && inf.notes['GPV' + g] === 'EmergencyShutdowns') || !!(inf.fallback && inf.fallback['GPV' + g]));
  }
  function hoursFor(key) {
    const day = key && data.fact.data[key];
    return (day && day['GPV' + group]) || null;
  }
  function typeText(v) {
    const t = data && data.preset && data.preset.time_type;
    return (t && typeof t[v] === 'string' && t[v]) || TYPES[v] || v || 'немає даних';
  }
  function hourLabel(h) {
    const tz = data && data.preset && data.preset.time_zone && data.preset.time_zone[h + 1];
    const v = Array.isArray(tz) ? tz[0] : tz;
    return typeof v === 'string' && v ? v : `${String(h).padStart(2, '0')}-${String(h + 1).padStart(2, '0')}`;
  }
  function cellFor(v, h) {
    const td = el('td', CELL[v] || 'c-na');
    const t = `${hourLabel(h)}: ${typeText(v)}`;
    td.title = t;
    td.setAttribute('aria-label', t);
    return td;
  }

  function renderGroups(keys) {
    const list = groupList();
    const box = $('groups');
    const sig = list.join(',');
    if (sig !== groupsSig) {
      groupsSig = sig;
      box.replaceChildren(...list.map((g) => {
        const b = el('button', 'sgroup', g);
        b.type = 'button';
        b.dataset.group = g;
        b.setAttribute('role', 'radio');
        b.addEventListener('click', () => setGroup(g));
        return b;
      }));
    }
    const todayData = data && keys.today ? data.fact.data[keys.today] : null;
    const titles = { on: 'Зараз за графіком світло є', off: 'Зараз за графіком світла немає', maybe: 'Зараз можливе відключення' };
    const n = kyiv(new Date());
    for (const b of box.children) {
      const g = b.dataset.group;
      const emergency = isEmergency(keys.today, g);
      const st = emergency ? 'off' : stateAt(todayData && todayData['GPV' + g], n);
      b.setAttribute('aria-checked', String(g === group));
      b.classList.remove('st-on', 'st-off', 'st-maybe');
      if (titles[st]) b.classList.add('st-' + st);
      const tip = emergency ? 'Діють екстрені відключення' : titles[st] || '';
      b.title = tip;
      b.setAttribute('aria-label', `Черга ${g}${tip ? '. ' + tip : ''}`);
    }
    $('group-title').textContent = `Черга ${group}`;
    document.title = `Черга ${group} · графік відключень`;
  }

  function renderNotices(keys) {
    const box = $('notices');
    box.replaceChildren();
    const add = (cls, text, detail) => {
      const n = el('div', `notice ${cls}`, text);
      if (detail) n.title = detail;
      box.append(n);
    };
    if (loadError && !data) {
      add('err', 'Не вдалося завантажити дані. Перевірте інтернет і натисніть «Оновити».', loadError);
      return;
    }
    if (yasnoErr && mirrorErr) {
      add('warn', 'Немає зв’язку. Показано дані останнього оновлення — вони орієнтовні.', yasnoErr);
    } else if (yasnoErr) {
      add('warn', `Не вдалося отримати свіжі дані YASNO. ${yasno ? 'Показано останні отримані дані — вони орієнтовні.' : 'Показано копію сайту ДТЕК — дані орієнтовні.'}`, yasnoErr);
    }
    if (!yasno && mirror && mirror.lastUpdateStatus && mirror.lastUpdateStatus.ok === false) {
      add('warn', 'Копія сайту ДТЕК давно не оновлювалась — графік орієнтовний.');
    }
    if (data && !keys.today) add('warn', 'У даних немає графіка на сьогодні. Перевірте на сайті ДТЕК.');
    const fb = [keys.today, keys.tomorrow].some((k) => k && data.info && data.info[k] && data.info[k].fallback && data.info[k].fallback['GPV' + group]);
    if (data && fb) add('warn', 'YASNO повідомляє про екстрені відключення — показано графік із копії сайту ДТЕК.');
  }

  function renderNow(today, tomorrow, emergency) {
    const box = $('now');
    box.replaceChildren();
    if (emergency) {
      box.hidden = false;
      box.className = 'outage st-off';
      const t = el('div', 'now-title');
      t.append(el('span', 'v-full', 'Діють екстрені відключення'), el('span', 'v-short', 'Екстрені відключення'));
      box.append(t, el('div', 'sub2', 'Графіки не застосовуються'));
      return;
    }
    if (!today) { box.hidden = true; return; }
    box.hidden = false;

    const all = slotsOf(today).concat(tomorrow ? slotsOf(tomorrow) : []);
    const n = kyiv(new Date());
    const nowSec = n.h * 3600 + n.m * 60 + n.s;
    const i = n.h * 2 + (n.m >= 30 ? 1 : 0);
    const cur = all[i];
    box.className = cur === 'on' || cur === 'off' ? `outage st-${cur}` : 'outage';
    let j = i;
    while (j < all.length && all[j] === cur) j++;
    const mins = Math.max(0, Math.ceil((j * 1800 - nowSec) / 60));
    const hh = Math.floor(mins / 60);
    const mm = mins % 60;
    const leftShort = `${hh}:${String(mm).padStart(2, '0')}`;
    const leftLong = hh && mm ? `${hh} год ${mm} хв` : hh ? `${hh} год` : `${mm} хв`;

    let title;
    let full = '';
    let short = '';
    if (cur === 'off' || cur === 'maybe') {
      title = cur === 'off' ? 'Зараз світла немає' : 'Зараз можливе відключення';
      full = `~ до ${at(j)} (через ${leftLong})`;
      short = `Орієнтовно до ${at(j)} (${leftShort})`;
    } else if (cur === 'on') {
      title = 'Зараз світло є';
      if (j < all.length) {
        const maybe = all[j] === 'maybe';
        full = `${maybe ? 'Можливе відключення' : 'Відключення'} о ${at(j)} (через ${leftLong})`;
        short = `${maybe ? 'Можливе відключення' : 'Відключення'} о ${at(j)} (${leftShort})`;
      } else {
        full = short = tomorrow ? 'Відключень до кінця завтра немає' : 'Відключень до кінця доби немає';
      }
    } else {
      title = 'Немає даних на поточну годину';
    }
    const titleEl = el('div', 'now-title');
    titleEl.append(el('span', 'v-full', title), el('span', 'v-short', cur === 'maybe' ? 'Можливо без світла' : title));
    box.append(titleEl);
    if (full) {
      const sub = el('div', 'sub2');
      sub.append(el('span', 'v-full', full), el('span', 'v-short', short));
      box.append(sub);
    }
  }

  function desktopTable(hours) {
    const table = el('table', 'fact');
    const thead = el('thead');
    const htr = el('tr');
    const head = el('th', 'head');
    const hd = el('div');
    hd.append('Часові', el('br'), 'проміжки');
    head.append(hd);
    htr.append(head);
    const btr = el('tr');
    btr.append(el('td', 'head'));
    for (let h = 0; h < 24; h++) {
      const th = el('th');
      th.scope = 'col';
      th.append(el('div', null, hourLabel(h)));
      htr.append(th);
      btr.append(cellFor(hours[h + 1], h));
    }
    thead.append(htr);
    const tbody = el('tbody');
    tbody.append(btr);
    table.append(thead, tbody);
    const wrap = el('div', 'fact-wrap');
    wrap.append(table);
    return wrap;
  }

  function mobileTables(hours) {
    const wrap = el('div', 'table2col');
    for (let x = 0; x < 2; x++) {
      const table = el('table');
      const thead = el('thead');
      const htr = el('tr');
      htr.append(el('th', 'head', 'Час'), el('th'));
      thead.append(htr);
      const tbody = el('tbody');
      for (let r = 0; r < 12; r++) {

        td.classList.add('cell');
        tr.append(td);
        tbody.append(tr);
      }
      table.append(thead, tbody);
      const tw = el('div', 't-wrap');
      tw.append(table);
      wrap.append(tw);

    return wrap;
  }

  function renderLegend() {
    const box = $('legend');
    box.replaceChildren();
    if (!data) return;
    const vals = new Set();
    const keys = dayKeys();
    for (const k of [keys.today, keys.tomorrow]) {
      const h = k && hoursFor(k);
      if (h) Object.values(h).forEach((v) => vals.add(v));
    }
    for (const d of past) {
      const h = d.groups && d.groups['GPV' + group];
      if (h) Object.values(h).forEach((v) => vals.add(v));
    }
    const items = ['yes', 'no', 'first', 'second'];
    for (const v of ['maybe', 'mfirst', 'msecond']) if (vals.has(v)) items.push(v);
    for (const v of items) {
      const li = el('div', 'li');
      li.append(el('span', `box ${CELL[v]}`), el('span', null, typeText(v)));
      box.append(li);
    }
  }

  const SHORT_PREFIX = { 'на сьогодні': 'сьогодні', 'на завтра': 'завтра', 'за вчора': 'вчора', 'за': '' };
  function pillEl(prefix, date, past) {
    const pill = el('div', past ? 'date-pill past' : 'date-pill');
    const label = el('div', 'pill-label');
    const sp = SHORT_PREFIX[prefix] ?? prefix;
    label.append(
      el('span', 'p-full', `${prefix} ${pillFmt.format(date)}`),
      el('span', 'p-short', `${sp ? sp + ' ' : ''}${pillShortFmt.format(date)}`),
    );
    pill.append(el('div', 'ic'), label);
    return pill;
  }
  function messageEl(strong, text) {
    const m = el('div', 'info-message');
    m.append(el('b', null, strong));
    if (text) m.append(el('span', null, text));
    return m;
  }

  const durText = (halves) => (halves === 1 ? '30 хв' : `${(halves / 2).toLocaleString('uk-UA')} год`);

  function summaryEl(segs) {
    const summary = el('div', 'summary');
    if (!segs.some((s) => s.kind === 'off' || s.kind === 'maybe')) {
      summary.append(el('div', 'summary-none', 'Відключень за графіком немає'));
    } else {
      const rowOff = el('div', 'ranges');
      for (const s of segs) {
        if (s.kind === 'on' || s.kind === 'na') continue;

        pill.append(el('span', 'ic'), `${hhmm(s.a)} – ${hhmm(s.b)}`);
        if (s.kind === 'maybe') pill.append(el('small', null, 'можливо'));
        pill.title = `${s.kind === 'maybe' ? 'Можливе відключення' : 'Світла немає'}: ${durText(s.b - s.a)}`;
        rowOff.append(pill);
      }
      summary.append(rowOff);
    }
    return summary;
  }

  function barEl(segs, showNow) {
    const KIND = { on: 'Світло є', off: 'Світла немає', maybe: 'Можливе відключення', na: 'Немає даних' };
    const bar = el('div', 'daybar');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', segs.map((s) => `${KIND[s.kind]} ${hhmm(s.a)}–${hhmm(s.b)}`).join('; '));
    for (const s of segs) {
      const seg = el('div', `seg ${s.kind}${(s.b - s.a) % 2 === 0 ? ' int' : ''}`);
      seg.style.flexGrow = String(s.b - s.a);
      seg.title = `${KIND[s.kind]}: ${hhmm(s.a)} – ${hhmm(s.b)} (${durText(s.b - s.a)})`;
      if (s.kind !== 'na') seg.append(el('span', 'ic'));
      seg.append(el('span', 'num', ((s.b - s.a) / 2).toLocaleString('uk-UA')), el('span', 'unit', 'г'));
      bar.append(seg);
    }
    if (showNow) {
      const mark = el('div', 'now-mark');
      placeNowMark(mark, kyiv(new Date()));
      bar.append(mark);

    return bar;

  function totalsEl(slots, segs) {
    const count = (k) => slots.filter((s) => s === k).length;
    const totals = el('div', 'totals');
    const total = (kind, halves, label) => {
      const t = el('span', 'total');
      t.append(el('span', `dot ${kind}`), el('b', null, durText(halves)), ` ${label}`);
      return t;
    };
    totals.append(total('off', count('off'), 'без світла'), total('on', count('on'), 'зі світлом'));
    if (count('maybe')) totals.append(total('maybe', count('maybe'), 'можливо без світла'));
    const n = segs.filter((s) => s.kind === 'off' || s.kind === 'maybe').length;
    const word = n % 10 === 1 && n % 100 !== 11 ? 'відключення'
      : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'відключення' : 'відключень';
    const cnt = el('span', 'total');
    cnt.append(el('span', 'dot off'), el('b', null, String(n)), ` ${word}`);
    totals.append(cnt);
    return totals;
  }

  function fillDay(box, hours, isToday) {
    const slots = slotsOf(hours);
    const segs = segmentsOf(slots);
    box.append(summaryEl(segs), desktopTable(hours), mobileTables(hours), barEl(segs, isToday), totalsEl(slots, segs));
  }

  function renderDay(box, prefix, key, hours, fallbackMs, isToday) {
    box.replaceChildren();
    box.append(pillEl(prefix, key ? new Date(Number(key) * 1000) : new Date(fallbackMs), false));
    const message = (strong, text) => box.append(messageEl(strong, text));
    if (!data) { message(loadError ? 'Немає даних' : 'Завантаження…'); return; }
    if (!key) {
      if (isToday) message('Графіків на сьогодні поки немає', 'Очікуйте на оновлення графіків або перевірте на сайті ДТЕК.');
      else message('Графіків на завтра поки немає', 'Інформація від НЕК «Укренерго» про обмеження на наступний день ще не надходила.');
      return;
    }
    const info = (data.info && data.info[key]) || {};
    if (!hours) {
      if (info.notes && info.notes['GPV' + group] === 'EmergencyShutdowns') {
        message('Діють екстрені відключення', 'Графіки стабілізаційних відключень зараз не застосовуються. Час відновлення світла може змінюватися.');
      } else {
        message(`Для черги ${group} на цей день графіка поки немає`);
      }
      return;
    }
    fillDay(box, hours, isToday);
  }

  let past = [];
  let pastBase = 0;
  let pastLoading = false;
  let pastError = null;
  let pastExhausted = false;
  const prevBtn = el('button', 'prev-btn');
  prevBtn.type = 'button';
  prevBtn.addEventListener('click', loadPrevDay);
  const pastErr = el('div', 'past-error');

  function readDayCache(ymd) {
    try {
      const v = JSON.parse(localStorage.getItem('dtek-day-' + ymd) || 'null');
      return v && v.groups && typeof v.groups === 'object' && Number(v.key) ? v : null;
    } catch (e) { return null; }
  }
  function writeDayCache(ymd, day) {
    try { localStorage.setItem('dtek-day-' + ymd, JSON.stringify(day)); } catch (e) {}
  }

  async function fetchDay(key) {
    const ymd = kyiv(new Date(key * 1000)).ymd;
    const cached = readDayCache(ymd);
    if (cached) return cached;
    const until = new Date((nextMidnight(key) - 1) * 1000).toISOString();
    const r = await fetch(HISTORY_API + encodeURIComponent(until));
    if (r.status === 403 || r.status === 429) throw new Error('GitHub тимчасово обмежив кількість запитів (60 на годину). Спробуйте пізніше.');
    if (!r.ok) throw new Error(`GitHub API: HTTP ${r.status}`);
    const commits = await r.json();
    const sha = Array.isArray(commits) && commits[0] && commits[0].sha;
    if (!sha) return { ymd, key, none: true };
    if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('неочікувана відповідь GitHub');
    const r2 = await fetch(RAW_AT(sha));
    if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
    const json = await r2.json();
    const days = (json && json.fact && json.fact.data) || {};
    const dk = Object.keys(days).find((k) => kyiv(new Date(Number(k) * 1000)).ymd === ymd);
    if (!dk) return { ymd, key, missing: true };
    const day = { ymd, key, groups: days[dk] };
    writeDayCache(ymd, day);
    return day;
  }

  async function loadPrevDay() {
    if (pastLoading || pastExhausted) return;
    const base = kyivMidnight(Date.now());
    if (base !== pastBase) { past = []; pastBase = base; pastExhausted = false; }
    pastLoading = true;
    pastError = null;
    renderPast();
    try {
      const from = past.length ? past[past.length - 1].key : base;
      const day = await fetchDay(prevMidnight(from));
      if (day.none) pastExhausted = true;
      else past.push(day);
    } catch (e) {
      pastError = (e && e.message) || String(e);
    } finally {
      pastLoading = false;
      renderPast();
    }
  }

  function renderPast() {
    const base = kyivMidnight(Date.now());
    if (pastBase && base !== pastBase) { past = []; pastBase = base; pastExhausted = false; }
    const yesterday = kyiv(new Date((base - 3600) * 1000)).ymd;
    const box = $('past');
    box.replaceChildren();
    for (const day of past.slice().reverse()) {
      const sec = el('section', 'day');
      sec.append(pillEl(day.ymd === yesterday ? 'за вчора' : 'за', new Date(day.key * 1000), true));
      const hours = day.groups && day.groups['GPV' + group];
      if (day.missing) sec.append(messageEl('За цей день даних немає', 'У копії даних немає графіка на цю дату.'));
      else if (!hours) sec.append(messageEl(`Для черги ${group} за цей день даних немає`));
      else fillDay(sec, hours, false);
      box.append(sec);
    }
    const top = box.querySelector('.date-pill') || document.querySelector('#today .date-pill');
    const nextKey = prevMidnight(past.length ? past[past.length - 1].key : base);
    const hint = pastExhausted ? 'Старіших даних немає' : `Показати графік за ${pillFmt.format(new Date(nextKey * 1000))}`;
    prevBtn.disabled = pastLoading || pastExhausted;
    prevBtn.title = hint;
    prevBtn.setAttribute('aria-label', hint);
    prevBtn.replaceChildren(
      el('span', 'full', pastLoading ? 'Завантаження…' : pastExhausted ? 'Старіших немає' : '‹ Попередній день'),
      el('span', 'short', pastLoading ? '…' : pastExhausted ? 'Немає' : 'Раніше'),
    );
    if (top) top.append(prevBtn); else prevBtn.remove();
    if (pastError && top) {
      pastErr.textContent = pastError;
      top.after(pastErr);
    } else {
      pastErr.remove();
    }
    renderLegend();
  }

  function renderMeta() {
    const box = $('meta');
    box.replaceChildren();
    const parts = [];
    if (yasnoAt) {
      const stale = Date.now() - yasnoAt > 60 * 1000 ? ' (свіжі дані YASNO — кнопкою «Оновити»)' : '';
      parts.push(`YASNO запитано о ${timeSecFmt.format(new Date(yasnoAt))}${stale}`);
    }
    const checked = mirror && mirror.lastUpdateStatus && Date.parse(mirror.lastUpdateStatus.at);
    if (checked) parts.push(`копію сайту ДТЕК перевірено о ${timeFmt.format(new Date(checked))}`);
    if (parts.length) box.append(el('p', null, parts.join(' · ') + '.'));
    const links = el('p');
    const a1 = el('a', null, 'Сайт ДТЕК');
    a1.href = SITE; a1.target = '_blank'; a1.rel = 'noopener';
    const a2 = el('a', null, 'копія даних ДТЕК');
    a2.href = REPO; a2.target = '_blank'; a2.rel = 'noopener';
    links.append(a1, ' · ', a2);
    box.append(links);
  }

  let renderedDay = 0;
  function currentDays() {
    const keys = dayKeys();
    const today = data && keys.today ? hoursFor(keys.today) : null;
    const tomorrow = data && keys.tomorrow ? hoursFor(keys.tomorrow) : null;
    return { keys, today, tomorrow, emergency: isEmergency(keys.today, group) };
  }

  function tick() {
    if (document.hidden) return;
    if (kyivMidnight(Date.now()) !== renderedDay) { render(); return; }
    const { keys, today, tomorrow, emergency } = currentDays();
    renderGroups(keys);
    renderNow(today, tomorrow, emergency);
    const mark = document.querySelector('#today .now-mark');
    if (mark) placeNowMark(mark, kyiv(new Date()));
  }

  function render() {
    renderedDay = kyivMidnight(Date.now());
    const { keys, today, tomorrow, emergency } = currentDays();
    renderGroups(keys);
    renderNotices(keys);
    renderNow(today, tomorrow, emergency);
    const now = Date.now();
    renderDay($('today'), 'на сьогодні', keys.today, today, now, true);
    renderDay($('tomorrow'), 'на завтра', keys.tomorrow, tomorrow, now + 864e5, false);
    renderPast();
    renderMeta();
  }

  async function fetchMirror() {
    const r = await fetch(SRC, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const json = await r.json();
    if (!json || !json.fact || typeof json.fact.data !== 'object') throw new Error('неочікуваний формат');
    return json;
  }
  async function fetchYasno() {
    const r = await fetch(LIVE_URL, { cache: 'no-store' });
    const json = await r.json().catch(() => null);
    if (json && json.error) throw new Error(json.error);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    if (!json || !Object.values(json).some((g) => g && g.today)) throw new Error('неочікуваний формат');
    const fetchedAt = Date.parse(r.headers.get('X-Fetched-At') || '');
    return { days: parseYasno(json), fetchedAt: Number.isFinite(fetchedAt) ? fetchedAt : Date.now() };
  }

  async function load(live) {
    if (loading) return;
    loading = true;
    const btn = $('refresh');
    btn.disabled = true;
    btn.textContent = 'Оновлення…';
    const errText = (e) => (e && e.message) || String(e);
    try {
      const [m, y] = await Promise.allSettled(live ? [fetchMirror(), fetchYasno()] : [fetchMirror()]);
      if (m.status === 'fulfilled') { mirror = m.value; mirrorErr = null; } else mirrorErr = errText(m.reason);
      if (y && y.status === 'fulfilled') { yasno = y.value.days; yasnoAt = y.value.fetchedAt; yasnoErr = null; } else if (y) yasnoErr = errText(y.reason);
      data = mergeSources(mirror, yasno);
      loadedAt = Date.now();
      loadError = data ? null : (yasnoErr || mirrorErr || 'немає даних');
    } catch (e) {
      loadError = errText(e);
    } finally {
      loading = false;
      btn.textContent = 'Оновити';
      const left = REFRESH_COOLDOWN_MS - (Date.now() - lastManualAt);
      if (left > 0) setTimeout(() => { if (!loading) btn.disabled = false; }, left);
      else btn.disabled = false;
      render();
    }
  }

  $('refresh').addEventListener('click', () => {
    if (loading || Date.now() - lastManualAt < REFRESH_COOLDOWN_MS) return;
    lastManualAt = Date.now();
    load(true);
  });
  window.addEventListener('hashchange', () => {
    const g = readGroup();
    if (g && g !== group) { group = g; render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    tick();
    if (Date.now() - loadedAt > 30 * 1000) load(false);
  });
  (function minuteTick() {
    setTimeout(() => { tick(); minuteTick(); }, 60000 - (Date.now() % 60000) + 50);
  })();
  setInterval(() => { if (!document.hidden) load(false); }, RELOAD_MS);

  if (matchMedia('(hover: none)').matches) {
    const tip = el('div', 'tip');
    tip.setAttribute('role', 'tooltip');
    let tipFor = null;
    let tipTimer = 0;
    const hideTip = () => { tip.remove(); tipFor = null; clearTimeout(tipTimer); };
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[title]');
      if (!t || !t.title || t === tipFor || t.closest('button, a')) { hideTip(); return; }
      tipFor = t;
      tip.textContent = t.title;
      tip.style.left = tip.style.top = '0px';
      document.body.append(tip);
      const r = t.getBoundingClientRect();
      const w = tip.offsetWidth;
      const h = tip.offsetHeight;
      tip.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))}px`;
      tip.style.top = `${r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8}px`;
      clearTimeout(tipTimer);
      tipTimer = setTimeout(hideTip, 8000);
    });
    addEventListener('scroll', hideTip, { passive: true });
    addEventListener('resize', hideTip);
  }

  render();
  load(true);
})();
</script>
</body>
</html>
